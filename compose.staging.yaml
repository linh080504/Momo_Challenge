services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: paypause_stage
      POSTGRES_USER: paypause_stage
      POSTGRES_PASSWORD: ${PAYPAUSE_STAGE_POSTGRES_PASSWORD:?Set a URL-safe password for the isolated staging database}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ./infra/supabase/migrations/001_mvp.sql:/docker-entrypoint-initdb.d/001_mvp.sql:ro
      - ./infra/supabase/migrations/002_sample_reviews.sql:/docker-entrypoint-initdb.d/002_sample_reviews.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U paypause_stage -d paypause_stage"]
      interval: 3s
      timeout: 3s
      retries: 12
  api:
    environment:
      DATABASE_URL: postgresql://paypause_stage:${PAYPAUSE_STAGE_POSTGRES_PASSWORD}@postgres:5432/paypause_stage
      APP_SECRET: ${PAYPAUSE_STAGE_APP_SECRET:?Set an application secret for staging}
      ALLOWED_ORIGINS: http://127.0.0.1:3020,http://localhost:3020
      APP_VERSION: ${PAYPAUSE_STAGE_VERSION:-stage-local}
    ports: !override ["127.0.0.1:8020:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    ports: !override ["127.0.0.1:3020:3000"]
    build:
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8020
volumes:
  staging-postgres:
